<touchégg>
  <settings>
  </settings>
  <application name="All">
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L+Alt_L</modifiers>
        <keys>Right</keys>
        <on>end</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L+Alt_L</modifiers>
        <keys>Left</keys>
        <on>end</on>
      </action>
    </gesture>
    <gesture type="PINCH" fingers="5" direction="IN">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <keys>F4</keys>
        <on>end</on>
      </action>
    </gesture>
  </application>
</touchégg>
