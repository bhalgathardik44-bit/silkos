<!-- SilkOS animates every gesture itself from the Touchégg daemon's D-Bus stream, so this file
     deliberately claims no gestures. A <gesture> entry here would let the Touchégg client move the
     desktop, minimize or hide windows underneath the shell's own animation. -->
<touchégg>
  <settings>
  </settings>
  <application name="All">
  </application>
</touchégg>
