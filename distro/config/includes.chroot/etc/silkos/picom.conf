# SilkOS composites native windows because Openbox cannot round corners or animate them.
# The corner radius is overridden on the command line in silkos-xsession, since it has to track
# Xft.dpi at session start rather than be fixed here.
backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.28;
shadow-offset-x = -8;
shadow-offset-y = -8;

# Menus, tooltips and docks must not animate or they flicker on every open, so the animations are
# attached only to normal application windows instead of globally.
# The scale-and-fade presets are the honest limit of what picom can do: it shrinks toward the
# window's own centre, because it has no way to know where the SilkOS Dock sits on screen.
windows = (
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = [ "open" ];
        preset = "appear";
        scale = 0.96;
        duration = 0.2;
      },
      {
        triggers = [ "close" ];
        preset = "disappear";
        scale = 0.96;
        duration = 0.16;
      },
      {
        triggers = [ "hide" ];
        preset = "disappear";
        scale = 0.2;
        duration = 0.22;
      },
      {
        triggers = [ "show" ];
        preset = "appear";
        scale = 0.2;
        duration = 0.22;
      }
    );
  }
);
