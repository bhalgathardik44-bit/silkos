# GTK 4 reads its own system settings file; keep it identical to the GTK 3 one so Flatpak apps
# and GTK 3 apps do not drift apart. libadwaita apps ignore this and follow the dconf keys.
[Settings]
gtk-theme-name=WhiteSur-Light
gtk-icon-theme-name=WhiteSur
gtk-cursor-theme-name=WhiteSur-cursors
gtk-cursor-theme-size=24
gtk-font-name=Inter 11
gtk-decoration-layout=close,minimize,maximize:
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
gtk-enable-animations=1
