  sec:()=>'<h2>Security</h2><div class="grp"><p class="lock-settings-note">Set a separate SilkOS screen-lock password. Any non-empty password is accepted; there is no 8-character minimum. The password is stored as a salted hash.</p><form class="lock-settings"><label class="lock-current-row" hidden>Current password<input name="current" type="password" autocomplete="current-password"></label><label>New password<input name="password" type="password" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" required></label><button class="btn" type="submit">Save Password</button><p class="lock-settings-status" role="status" aria-live="polite"></p></form><div class="rw"><span>Lock this screen now</span><button class="btn" data-a="lock-now">Lock Screen</button></div></div>'};
 async function refreshLockSettings(){const note=pane.querySelector('.lock-settings-note'),status=pane.querySelector('.lock-settings-status'),current=pane.querySelector('.lock-current-row');
  if(!window.silk||!silk.lock){note.textContent='Screen-lock settings are available in the SilkOS desktop app.';return}
  try{const result=await silk.lock.status();if(!result.ok)throw new Error(result.error||'Could not read screen-lock settings.');lockConfigured=result.configured;current.hidden=!lockConfigured;status.textContent=lockConfigured?'A screen-lock password is set.':'No screen-lock password is set yet.'}
  catch(error){console.error('Could not load screen-lock settings:',error);status.textContent=error.message||'Could not load screen-lock settings.'}}
 function draw(k){cp=k;body.querySelectorAll('.it').forEach(n=>n.classList.toggle('on',n.dataset.p===k));const t=pane.scrollTop;pane.innerHTML=`<div class="settings-content">${P[k]()}</div>`;pane.scrollTop=t;if(k==='app'){pane.querySelector('.wallpaper-selected').textContent=cfg.wallpaperImage?'Custom image selected':'Choose an image from this device';pane.querySelector('[data-a="wallpaper-reset"]').disabled=!cfg.wallpaperImage}if(k==='stor')stor();if(k==='sec')refreshLockSettings();if(k==='display'){const slider=pane.querySelector('[data-r=volume]'),mute=pane.querySelector('[data-t=muted]'),status=pane.querySelector('.volume-status');if(!window.silk||silk.platform!=='linux'||!silk.volume){slider.disabled=true;mute.disabled=true;status.textContent='Requires Linux audio'}else silk.volume().then(actual=>{if(cp!=='display')return;if(!Number.isFinite(actual)){slider.disabled=true;mute.disabled=true;status.textContent='Audio output control is unavailable.';return}volume=cfg.volume=actual;cfg.muted=actual===0;if(actual>0)lastAudibleVolume=cfg.lastAudibleVolume=actual;slider.value=String(actual);mute.classList.toggle('on',cfg.muted);status.textContent='Connected Linux audio';save()})}}
 async function stor(){const g=pane.querySelector('.grp'),S=window.silk&&silk.persist;if(!S||silk.platform!=='linux'){g.innerHTML=rw('Saving','Only when SilkOS runs on Linux');return}let r;try{r=await S.status()}catch(error){console.error('Could not inspect storage devices:',error);if(cp==='stor')g.innerHTML=rw('Saving',error.message||'Could not inspect storage devices.');return}if(cp!=='stor')return;if(r.error){g.innerHTML=rw('Saving',r.error);return}
  g.innerHTML=r.on?rw('Saving','On: your files, settings and apps are kept'):r.has?rw('Saving','Ready. Restart SilkOS to turn it on'):r.disk?`<div class="rw"><span>Save everything on empty disk ${esc(r.disk.name)} (${esc(r.disk.size)})</span><button class="stb" data-a="pers" data-d="${esc(r.disk.name)}">Set up</button></div>`:rw('Saving','Off')+'<div class="rw"><span class="mut">Add a second, empty virtual disk (8 GB or more) to this VM, restart, then come back here.</span></div>'}
 nav.onclick=e=>{const n=e.target.closest('.it');if(n)draw(n.dataset.p)};

 pane.onclick=async e=>{const t=e.target.closest('[data-th],[data-ac],[data-w],[data-t],[data-e],[data-a]');if(!t)return;const d=t.dataset;
  if(d.a==='wallpaper-select'){
   const status=pane.querySelector('.wallpaper-status');
   if(!window.silk||!silk.selectWallpaper){status.textContent='Custom wallpapers are available in the SilkOS desktop app.';return}
   t.disabled=true;status.textContent='Choose an image…';
   try{const result=await silk.selectWallpaper();if(result?.cancelled){status.textContent='';return}if(!result?.ok)throw new Error(result?.error||'Could not select an image.');cfg.wallpaperImage=result.url;save();applyCfg();draw(cp)}
   catch(error){console.error('Could not set custom wallpaper:',error);status.textContent=error.message||'Could not set custom wallpaper.'}
   finally{if(t.isConnected)t.disabled=false}

  if(d.a==='pers'){if(!confirm('Set up disk '+d.d+' for saving? Anything on it will be erased.'))return;t.disabled=true;t.textContent='Setting up…';silk.persist.setup(d.d).then(r=>{if(r.ok)stor();else{t.disabled=false;t.textContent='Retry';alert('Setup failed: '+(r.error||'unknown error'))}});return}
  if(d.th)cfg.theme=d.th;else if(d.ac)cfg.accent=d.ac;else if(d.w!==undefined){cfg.wall=+d.w;cfg.wallpaperImage=''}else if(d.e)cfg.engine=d.e;
  else if(d.t==='fs')toggleFS();else if(d.t==='muted'){cfg.muted=!cfg.muted;const next=cfg.muted?0:(cfg.lastAudibleVolume||lastAudibleVolume||cfg.volume||50);setVolume(next,true,pane.querySelector('.volume-status'));save();t.classList.toggle('on',cfg.muted);const slider=pane.querySelector('[data-r=volume]');if(slider)slider.value=String(next);return}else if(d.t)cfg[d.t]=!cfg[d.t];
  else if(d.a==='reset'){Object.assign(cfg,DEF);cfg.dockOrder=[...Object.keys(apps),'launchpad'];cfg.launchpadOrder=Object.keys(apps);applySavedOrder(dock,'.ic','dockOrder');lpDraw();try{localStorage.removeItem('silk.windows');localStorage.removeItem('silk.session')}catch(error){console.error('Could not clear saved app settings:',error)}setBrightness(cfg.bri,true);setVolume(cfg.volume,true)}else if(d.a==='clrh')store.set('hist',[]);else if(d.a==='clrb')store.set('bm',[]);
  if(d.t==='restoreWindows'){if(cfg.restoreWindows)saveSessionWindows();else try{localStorage.removeItem('silk.session')}catch(error){console.error('Could not clear the saved app session:',error)}}
  save();applyCfg();draw(cp);if(switchState)paintSwitcher();if(['showHiddenFiles','hideFileExtensions','finderLocation','finderSort'].includes(d.t))Object.values(wins).forEach(w=>w._refresh&&w._refresh());if(d.a==='clrb')Object.values(wins).forEach(w=>w._b&&w._b.rebuild&&w._b.rebuild())};
 pane.onchange=e=>{const key=e.target.dataset.pref;if(!key)return;cfg[key]=e.target.value;save();applyCfg();if(switchState)paintSwitcher();draw(cp);if(key==='finderLocation')Object.values(wins).forEach(w=>w._setFinderLocation&&w._setFinderLocation());else if(key==='finderSort')Object.values(wins).forEach(w=>w._refresh&&w._refresh())};
 pane.onsubmit=async e=>{const form=e.target.closest('.lock-settings');if(!form)return;e.preventDefault();
  const password=form.elements.password.value,confirmPassword=form.elements.confirm.value,currentPassword=form.elements.current.value,status=form.querySelector('.lock-settings-status'),button=form.querySelector('button');
  if(password!==confirmPassword){status.textContent='The new passwords do not match.';form.elements.confirm.focus();return}
  button.disabled=true;status.textContent='';
  try{const result=await silk.lock.setPassword(password,lockConfigured?currentPassword:undefined);if(!result.ok)throw new Error(result.error||'Could not save the screen-lock password.');
   lockConfigured=true;form.reset();status.textContent='Screen-lock password saved.';form.querySelector('.lock-current-row').hidden=false}
  catch(error){console.error('Could not update screen-lock password:',error);status.textContent=error.message||'Could not update the screen-lock password.'}
