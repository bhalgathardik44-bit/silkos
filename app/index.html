function shortcut(k){if(k==='lp')return launchpad();if(k==='k'||k===' ')return spot(!sp.classList.contains('on'));const b=curApp==='browser'&&wins.browser&&wins.browser._b;if(!b)return;
 if(k==='t')b.add('');else if(k==='w')b.closeCur();else if(k==='l')b.addr();else if(k==='r')b.reload();else if(k==='d')b.addBm()}

const DEF={theme:'auto',accent:'#0a60ff',wall:0,lite:false,dock:56,mag:true,magAmt:1.7,hide:false,engine:'google',sugg:true,bri:100};
const cfg=Object.assign({},DEF,(()=>{try{return JSON.parse(localStorage.getItem('silk.cfg'))||{}}catch(e){return{}}})());
const save=()=>{try{localStorage.setItem('silk.cfg',JSON.stringify(cfg))}catch(e){}};
const ENG={google:{n:'Google',u:'https://www.google.com/search?q='},ddg:{n:'DuckDuckGo',u:'https://duckduckgo.com/?q='},bing:{n:'Bing',u:'https://www.bing.com/search?q='}};
function searchURL(v){return(ENG[cfg.engine]||ENG.google).u+encodeURIComponent(v)}
const WALLS=[['Aurora','radial-gradient(60% 60% at 20% 20%,#7aa7ff,transparent),radial-gradient(50% 50% at 80% 30%,#ff8fc7,transparent),radial-gradient(60% 60% at 60% 90%,#ffc27a,transparent),#3b3b8f'],['Sunset','radial-gradient(70% 60% at 30% 100%,#ff5e62,transparent),radial-gradient(60% 60% at 80% 20%,#ffc371,transparent),#5b2a86'],['Ocean','radial-gradient(60% 60% at 20% 30%,#4facfe,transparent),radial-gradient(60% 70% at 85% 80%,#00f2c3,transparent),#0b2a5b'],['Forest','radial-gradient(60% 60% at 25% 25%,#9be15d,transparent),radial-gradient(60% 60% at 80% 80%,#00a99d,transparent),#0f3d2e'],['Graphite','radial-gradient(60% 60% at 30% 20%,#6b7280,transparent),radial-gradient(60% 60% at 80% 90%,#374151,transparent),#111827']];
function applyCfg(){const R=document.documentElement;cfg.theme==='auto'?R.removeAttribute('data-theme'):R.setAttribute('data-theme',cfg.theme);R.style.setProperty('--accent',cfg.accent);
 $('#wall').style.background=WALLS[cfg.wall]?WALLS[cfg.wall][1]:WALLS[0][1];document.body.classList.toggle('lite',!!cfg.lite);
 base=cfg.dock;maxS=cfg.mag?cfg.magAmt:1;$('#dockwrap').classList.toggle('ah',!!cfg.hide);bri=cfg.bri;dim.style.opacity=(100-bri)/100*.85}
document.addEventListener('mousemove',e=>{if(!cfg.hide)return;const w=$('#dockwrap');w.classList.toggle('show',e.clientY>innerHeight-10||(w.classList.contains('show')&&e.clientY>innerHeight-120))});
function resizify(el){['n','s','e','w','ne','nw','se','sw'].forEach(d=>{const h=document.createElement('div');h.className='rz '+d;el.appendChild(h);
 h.onpointerdown=ev=>{if(el.dataset.max)return;ev.preventDefault();ev.stopPropagation();h.setPointerCapture(ev.pointerId);
  const r={l:el.offsetLeft,t:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight,x:ev.clientX,y:ev.clientY};el.classList.add('rzing');
  const mv=m=>{const dx=m.clientX-r.x,dy=m.clientY-r.y;let L=r.l,T=r.t,W=r.w,H=r.h;
   if(d.includes('e'))W=Math.max(300,r.w+dx);if(d.includes('s'))H=Math.max(200,r.h+dy);
   if(d.includes('w')){W=Math.max(300,r.w-dx);L=r.l+r.w-W}if(d.includes('n')){H=Math.max(200,r.h-dy);T=r.t+r.h-H;if(T<28){H-=28-T;T=28}}
   Object.assign(el.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'})};
  const up=()=>{el.classList.remove('rzing');h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)}})}
function settingsInit(el){
 const NAV=[['gen','General','⚙️','#8e8e93'],['app','Appearance','🎨','#0a84ff'],['desk','Desktop & Dock','🖼️','#af52de'],['disp','Displays','🖥️','#30b0c7'],['web','Browser','🧭','#34c759'],['stor','Storage','💾','#ff9500']];
 const body=el.querySelector('.body');body.innerHTML='<div class="set"><div class="sbn">'+NAV.map(n=>`<div class="it" data-p="${n[0]}"><b style="background:${n[3]}">${n[2]}</b>${n[1]}</div>`).join('')+'</div><div class="pane"></div></div>';
 const pane=body.querySelector('.pane');let cp='gen';
 const tg=(k,l)=>`<div class="rw"><span>${l}</span><button class="tg${cfg[k]?' on':''}" data-t="${k}"></button></div>`;
 const sl=(k,l,a,b,v,sc)=>`<div class="rw"><span>${l}</span><input class="sl" type="range" min="${a}" max="${b}" value="${v}" data-r="${k}" data-sc="${sc||1}"></div>`;
 const rw=(l,v)=>`<div class="rw"><span>${l}</span><span class="mut">${v}</span></div>`;
 const P={
  gen:()=>'<h2>General</h2><div class="grp">'+rw('SilkOS','Version 1.0')+rw('Engine',(navigator.userAgent.match(/Electron\/[\d.]+/)||['Web browser'])[0])+rw('Processor cores',navigator.hardwareConcurrency||'–')+rw('Memory',navigator.deviceMemory?'≥ '+navigator.deviceMemory+' GB':'–')+rw('Display',screen.width+' × '+screen.height)+'</div><div class="grp"><div class="rw"><span>Reset all settings</span><button class="btn" data-a="reset">Reset</button></div></div>',
  app:()=>'<h2>Appearance</h2><h3>Theme</h3><div class="grp"><div class="tiles">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(t=>`<div class="tl2${cfg.theme===t[0]?' on':''}" data-th="${t[0]}"><div class="pv ${t[0]}"></div><span>${t[1]}</span></div>`).join('')+'</div></div><h3>Accent color</h3><div class="grp"><div class="acs">'+['#0a60ff','#af52de','#ff2d92','#ff3b30','#ff9500','#34c759','#8e8e93'].map(c=>`<div class="ac${cfg.accent===c?' on':''}" data-ac="${c}" style="background:${c}"></div>`).join('')+'</div></div><div class="grp">'+tg('lite','Reduce transparency (Lite Mode)')+'</div>',
  desk:()=>'<h2>Desktop & Dock</h2><h3>Wallpaper</h3><div class="grp"><div class="wps">'+WALLS.map((w,i)=>`<div class="wp${cfg.wall===i?' on':''}" data-w="${i}" style="background:${w[1]}"><span>${w[0]}</span></div>`).join('')+'</div></div><h3>Dock</h3><div class="grp">'+sl('dock','Size',40,80,cfg.dock)+tg('mag','Magnification')+sl('magAmt','Magnification amount',12,20,Math.round(cfg.magAmt*10),.1)+tg('hide','Automatically hide the Dock')+'</div>',
  stor:()=>'<h2>Storage</h2><div class="grp">'+rw('Saving','Checking…')+'</div>',
  disp:()=>'<h2>Displays</h2><div class="grp">'+sl('bri','Brightness',25,100,cfg.bri)+`<div class="rw"><span>Full screen</span><button class="tg${document.fullscreenElement?' on':''}" data-t="fs"></button></div></div>`,
  web:()=>'<h2>Browser</h2><h3>Search engine</h3><div class="grp">'+Object.entries(ENG).map(([k,e])=>`<div class="rw pick" data-e="${k}"><span>${e.n}</span><span class="ck">${cfg.engine===k?'✓':''}</span></div>`).join('')+'</div><div class="grp">'+tg('sugg','Show live search suggestions')+'</div><h3>Data</h3><div class="grp"><div class="rw"><span>History · '+store.get('hist').length+' items</span><button class="btn" data-a="clrh">Clear</button></div><div class="rw"><span>Bookmarks · '+store.get('bm').length+' items</span><button class="btn" data-a="clrb">Clear</button></div></div>'};
 function draw(k){cp=k;body.querySelectorAll('.it').forEach(n=>n.classList.toggle('on',n.dataset.p===k));const t=pane.scrollTop;pane.innerHTML=P[k]();pane.scrollTop=t;if(k==='stor')stor()}
 async function stor(){const g=pane.querySelector('.grp'),S=window.silk&&silk.persist;if(!S){g.innerHTML=rw('Saving','Only when SilkOS runs on Linux');return}const r=await S.status();if(cp!=='stor')return;
  g.innerHTML=r.on?rw('Saving','On: your files, settings and apps are kept'):r.has?rw('Saving','Ready. Restart SilkOS to turn it on'):r.disk?`<div class="rw"><span>Save everything on empty disk ${esc(r.disk.name)} (${esc(r.disk.size)})</span><button class="stb" data-a="pers" data-d="${esc(r.disk.name)}">Set up</button></div>`:rw('Saving','Off')+'<div class="rw"><span class="mut">Add a second, empty virtual disk (8 GB or more) to this VM, restart, then come back here.</span></div>'}
 body.querySelector('.sbn').onclick=e=>{const n=e.target.closest('.it');if(n)draw(n.dataset.p)};
 pane.onclick=e=>{const t=e.target.closest('[data-th],[data-ac],[data-w],[data-t],[data-e],[data-a]');if(!t)return;const d=t.dataset;
  if(d.a==='pers'){if(!confirm('Set up disk '+d.d+' for saving? Anything on it will be erased.'))return;t.disabled=true;t.textContent='Setting up…';silk.persist.setup(d.d).then(r=>{if(r.ok)stor();else{t.disabled=false;t.textContent='Retry';alert('Setup failed: '+(r.error||'unknown error'))}});return}
  if(d.th)cfg.theme=d.th;else if(d.ac)cfg.accent=d.ac;else if(d.w)cfg.wall=+d.w;else if(d.e)cfg.engine=d.e;
  else if(d.t==='fs')toggleFS();else if(d.t)cfg[d.t]=!cfg[d.t];
  else if(d.a==='reset'){Object.assign(cfg,DEF)}else if(d.a==='clrh')store.set('hist',[]);else if(d.a==='clrb')store.set('bm',[]);
  save();applyCfg();draw(cp);if(d.a==='clrb')Object.values(wins).forEach(w=>w._b&&w._b.rebuild&&w._b.rebuild())};
 pane.oninput=e=>{const r=e.target.dataset.r;if(!r)return;cfg[r]=+e.target.value*(+e.target.dataset.sc);save();applyCfg()};
 el._go=draw;draw('gen')}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.win,.dd,#dockwrap,#menubar'))return;e.preventDefault();closeDd(true);
 const open=p=>{launch('settings');setTimeout(()=>wins.settings&&wins.settings._go(p),60)};
 const el=listEl([['Change Wallpaper…',()=>open('desk')],['Use '+(document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches)?'Light':'Dark')+' Mode',()=>{const dk=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);cfg.theme=dk?'light':'dark';save();applyCfg()}],'-',['Open Browser',()=>launch('browser')],['Spotlight Search',()=>spot(true),'Ctrl+K'],['Settings…',()=>open('gen')]]);
 ddKey='ctx';dd=el;el.classList.add('dd');document.body.appendChild(el);el.style.left=Math.min(e.clientX,innerWidth-250)+'px';el.style.top=Math.min(e.clientY,innerHeight-220)+'px';requestAnimationFrame(()=>el.classList.add('on'))});
applyCfg();
buildBar();
syncFlatpaks();
