<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SilkOS</title>
<style>
#startup{position:fixed;inset:0;z-index:1000000;display:grid;place-items:center;color:#fff;background:radial-gradient(ellipse at 20% 20%,#7aa7ff55,transparent 65%),radial-gradient(ellipse at 80% 70%,#ff8fc733,transparent 60%),#242442;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:opacity .16s cubic-bezier(.32,.72,0,1)}
#startup .startup-card{text-align:center;padding:32px;max-width:440px;animation:startup-enter .28s cubic-bezier(.32,.72,0,1) both;transition:transform .16s cubic-bezier(.32,.72,0,1)}
#startup .startup-mark{width:44px;height:44px;margin:0 auto 24px;display:block;opacity:.85;animation:startup-breathe 1.8s ease-in-out infinite}
#startup h1{font-size:46px;font-weight:600;letter-spacing:-.04em;line-height:1.15;margin:0 0 30px}
#startup .startup-track{width:132px;height:3px;margin:0 auto 22px;overflow:hidden;border-radius:3px;background:#ffffff24}
#startup .startup-track span{display:block;width:45%;height:100%;border-radius:3px;background:#ffffffb8;animation:startup-flow 1.4s ease-in-out infinite}
#startup-status{font-size:13px;font-weight:400;letter-spacing:.01em;line-height:1.6;opacity:.65;margin:0}
#startup-retry{margin-top:22px;padding:9px 20px;border:1px solid #ffffff26;border-radius:10px;background:#ffffff12;color:inherit;font:inherit;font-size:13px;cursor:pointer}
#startup-retry:hover{background:#ffffff24}#startup-retry:focus-visible{outline:2px solid white;outline-offset:4px}
#startup[data-state=error] .startup-track{display:none}#startup[data-state=error] .startup-track span{animation:none}
#startup.startup-leaving{opacity:0;pointer-events:none}#startup.startup-leaving .startup-track span{animation:none}
#startup.startup-leaving .startup-card{animation:none;transform:translateY(-6px) scale(1.015)}
#startup[data-state=error] .startup-mark,#startup.startup-leaving .startup-mark{animation:none}
@keyframes startup-enter{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes startup-breathe{0%,100%{opacity:.65;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@keyframes startup-flow{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
body.lite #startup,body.reduce-motion #startup,body.lite #startup *,body.reduce-motion #startup *{animation:none;transition:none}
@media(prefers-reduced-motion:reduce){#startup,#startup *{animation:none!important;transition:none!important}#startup .startup-track span{margin:auto}}
</style>
<link rel="stylesheet" href="desktop.css"></head><body>
<div id="startup" role="status" aria-live="polite" aria-busy="true">
 <div class="startup-card">
  <svg class="startup-mark" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 2c2.7 13.8 8.2 19.3 22 22-13.8 2.7-19.3 8.2-22 22C21.3 32.2 15.8 26.7 2 24 15.8 21.3 21.3 15.8 24 2Z"/></svg>
  <h1>SilkOS</h1>
  <div class="startup-track" aria-hidden="true"><span></span></div>
  <p id="startup-status">Preparing your desktop</p>
  <button id="startup-retry" type="button" hidden onclick="location.reload()">Try Again</button>
 </div>
</div>
<script src="startup.js" onerror="document.getElementById('startup').dataset.state='error';document.getElementById('startup-status').textContent='SilkOS could not prepare your desktop. Please try again.';document.getElementById('startup-retry').hidden=false"></script>
<div id="wall"></div>
<div id="menubar"><div id="mleft"></div><div id="mright"></div></div>
<div id="desk"></div>
<div id="dockwrap"><div id="dock" class="glass"></div></div>
<script src="apps/notes.js"></script>
<script src="apps/finder.js"></script>
<script src="apps/store.js"></script>
<script src="apps/utilities.js"></script>
<script src="apps/browser.js"></script>
<script src="apps/settings.js"></script>
<script src="shell.js"></script></body></html>
